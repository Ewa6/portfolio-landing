<!doctype html><meta charset="utf-8"><title>Lockup source</title><link rel="stylesheet" href="../../fonts/fonts.css">
<!-- Lockup recipe: mark height = 1.3 x text cap height box (mark 56 px with 36 px text), gap = 0.25 x mark width, Inter 600, tracking -0.01em. -->
<style>body{margin:0;display:grid;gap:20px;padding:20px;width:max-content}
.lockup{display:inline-flex;align-items:center;gap:14px;font:600 36px/1 Inter,sans-serif;letter-spacing:-.01em;padding:4px 6px 4px 2px}
.lockup img{width:56px;height:56px}#dark{color:#E8EBF7}#light{color:#162444}</style>
<div class="lockup" id="dark"><img src="../exports/mark-colour-on-dark.svg" alt="">Ewa Jabłońska</div>
<div class="lockup" id="light"><img src="../exports/mark-colour-on-light.svg" alt="">Ewa Jabłońska</div>
